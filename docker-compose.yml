version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: kodama-postgres
    environment:
      POSTGRES_USER: kodama
      POSTGRES_PASSWORD: kodama
      POSTGRES_DB: kodama
    ports:
      - "5454:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
